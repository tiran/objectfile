[tox]
requires =
    tox>=4.21
    tox-uv>=1.13
env_list =
    lint
    typecheck
    py312
    py313
    py314
isolated_build = true

[gh]
python =
    3.12 = py312
    3.13 = py313
    3.14 = py314, lint, typecheck

[testenv]
description = run the test suite
runner = uv-venv-lock-runner
dependency_groups = test
commands =
    pytest {posargs}

[testenv:lint]
description = lint and format check with ruff
skip_install = true
dependency_groups = lint
commands =
    ruff check python tests
    ruff format --check python tests

[testenv:fix]
description = auto-fix lint and format
skip_install = true
dependency_groups = lint
commands =
    ruff check --fix python tests
    ruff format python tests

[testenv:typecheck]
description = type-check with pyrefly
dependency_groups = typecheck
commands =
    pyrefly check python/objectfile tests
